id = "baiteryamato.kafei_puppet"
name = "Kafei Puppet"
version = "0.1.0"
api = ">=0.4 <0.6"
entrypoint = "main.lua"
description = "Press H to spawn a puppet with Young Link's skeleton. With a replacement .otr (e.g. Kafei) in the mods folder, the puppet uses the replaced model."
authors = ["BaiterYamato"]
games = ["oot"]

[capabilities]
required = ["actor.spawn", "actor.destroy", "actor.exists"]

[permissions]
grants = ["world.entities.create", "world.entities.destroy", "world.entities.read"]

[limits]
actors = 1
