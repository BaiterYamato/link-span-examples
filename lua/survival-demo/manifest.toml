id = "baiteryamato.survival_demo"
name = "Survival (demo)"
version = "0.3.0"
api = ">=0.4 <0.6"
entrypoint = "main.lua"
description = "Playable survival: hunger, thirst, stamina, temperature, a persistent bag and four consumables equipped on the D-pad with icons and counts."
authors = ["BaiterYamato"]
games = ["oot"]

[capabilities]
required = ["hud.draw", "hud.icons", "core.storage", "core.timers", "player.fields", "game.state", "input.actions"]
optional = ["player.speed", "hooks.bridge", "oot.env", "oot.player.roll"]
