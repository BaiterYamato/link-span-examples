id = "community.dog_spawner"
name = "Dog Spawner"
version = "0.2.0"
api = ">=0.2 <0.6"
entrypoint = "main.lua"
description = "Press F (rebindable) to spawn a dog. Works in OoT (Hyrule Market) and in MM (Clock Town)."
authors = ["BaiterYamato"]
games = ["oot", "mm"]

[capabilities]
optional = ["actor.spawn", "actor.destroy", "actor.exists", "mm.spawn_dog"]

[permissions]
grants = ["world.entities.create", "world.entities.destroy", "world.entities.read"]

[limits]
actors = 1
