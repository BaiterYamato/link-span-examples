id = "baiteryamato.leveling_demo"
name = "Leveling (demo)"
version = "0.1.0"
api = ">=0.4 <0.6"
entrypoint = "main.lua"
description = "Shows that an RPG/leveling system fits 100% in Lua: XP for defeating enemies (hook.oot.enemy.defeat) and a level saved to disk (ship.storage). Inspired by the 'leveled' fork — no native RPG function in the host."
authors = ["BaiterYamato"]
games = ["oot"]

[capabilities]
required = ["hooks.bridge", "core.storage"]
