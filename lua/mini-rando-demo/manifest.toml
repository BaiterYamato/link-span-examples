id = "baiteryamato.mini_rando_demo"
name = "Mini-rando (demo)"
version = "0.1.0"
api = ">=0.4 <0.6"
entrypoint = "main.lua"
description = "Shows that an item randomizer fits in Lua: swaps a check's item (hook.oot.item.give) and keeps the seed in a store shared between OoT and MM (ship.storage.shared). Inspired by ComboShip — no rando logic in the host."
authors = ["BaiterYamato"]
games = ["oot"]

[capabilities]
required = ["hooks.bridge", "core.storage.shared"]
